<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><style>html,body{margin:0}iframe{width:390px;height:900px;border:0}pre{font:12px monospace;color:#fff}</style></head>
<body>
  <iframe id="f"></iframe>
  <pre id="out">waiting</pre>
  <script>
    const f = document.getElementById("f");
    const out = document.getElementById("out");
    f.addEventListener("load", () => {
      const w = f.contentWindow;
      const d = f.contentDocument;
      const de = d.documentElement;
      const offenders = [...d.querySelectorAll("*")].filter((el) => {
        const r = el.getBoundingClientRect();
        return r.width > 0 && (r.right > de.clientWidth + 1 || r.left < -1);
      }).slice(0, 15).map((el) => ({
        tag: el.tagName,
        cls: String(el.className).slice(0, 50),
        left: Math.round(el.getBoundingClientRect().left),
        right: Math.round(el.getBoundingClientRect().right),
        width: Math.round(el.getBoundingClientRect().width),
      }));
      out.textContent = JSON.stringify({
        innerWidth: w.innerWidth,
        clientWidth: de.clientWidth,
        scrollWidth: de.scrollWidth,
        bodyScroll: d.body.scrollWidth,
        topbar: d.querySelector(".topbar")?.getBoundingClientRect().width,
        app: d.querySelector(".app")?.getBoundingClientRect().width,
        offenders,
      }, null, 1);
    });
    f.src = "/tower/";
  </script>
</body>
</html>
