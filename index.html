<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" href="data:,">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Йорстед — Башня</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
      <div class="music-widget" id="music-widget">
    <button id="music-toggle" type="button" title="Включить/Выключить музыку">🎵</button>
    <input type="range" id="music-volume" min="0" max="1" step="0.01" value="0.3" title="Громкость музыки" style="writing-mode: vertical-lr; direction: rtl;">
  </div>
   <script>
    // Включаем музыку при первом клике в любом месте
    document.addEventListener('pointerdown', function startMusic() {
      const audio = document.getElementById('bg-music');
      const isOn = localStorage.getItem("tower_music_on") !== "false";
      
      if (audio && isOn) {
        const savedVol = localStorage.getItem("tower_music_volume");
        // Проверяем именно на null, чтобы 0 сохранялся как 0
        audio.volume = savedVol !== null ? parseFloat(savedVol) : 0.3;
        audio.play().catch(function() {});
      }
      document.removeEventListener('pointerdown', startMusic);
    });
  </script>
  <audio id="bg-music" loop preload="auto">
    <source src="assets/music/theme-v1.mp3" type="audio/mpeg">
  </audio>
  <div class="app">
    <header class="topbar" id="topbar"></header>
    <main class="screen" id="screen"></main>
  </div>

  <!-- Порядок важен: каждый файл опирается на предыдущий. -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
